openapi: 3.1.0
info:
  title: PillPilot connected dashboard API
  version: 2.0.0
  description: |
    Local Next.js browser API. Server-only credentials forward requests to the shared
    reference service's /api/v1/devices/{device_id}/companion endpoint. No browser API
    fabricates events or operates actuators. Service/device OpenAPI is served at
    http://127.0.0.1:8000/openapi.json; see integration/INTERFACE.md.
servers:
  - url: http://127.0.0.1:3000
paths:
  /api/dashboard:
    get:
      summary: Read a coherent companion snapshot
      responses:
        '200':
          description: Labelled schedules, revisions, controller outcomes and mock notifications
          content:
            application/json:
              schema:
                type: object
                required: [device_id, revision, timezone, schedules, status, events, notifications]
                properties:
                  device_id: {type: string}
                  revision: {type: integer}
                  timezone: {const: Asia/Kolkata}
                  schedules:
                    type: array
                    items: {$ref: '#/components/schemas/CompanionSchedule'}
                  status:
                    type: object
                    description: desired_revision, applied_revision, synchronized and last_config_result; not a live heartbeat
                  events:
                    type: array
                    description: Newest-first dispensed/missed/error records, with received_at (UTC service receipt), occurred_at null, simulated and schedule_id
                    items: {type: object}
                  notifications:
                    type: array
                    description: Mock notification records with event_id and status=simulated
                    items: {type: object}
        '502': {$ref: '#/components/responses/Unavailable'}
        '503': {$ref: '#/components/responses/Unavailable'}
    put:
      summary: Atomically save app labels and desired device schedules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_revision, timezone, schedules]
              properties:
                expected_revision: {type: integer, minimum: 0, maximum: 4294967294}
                timezone: {const: Asia/Kolkata}
                schedules:
                  type: array
                  maxItems: 32
                  items: {$ref: '#/components/schemas/CompanionSchedule'}
      responses:
        '200':
          description: Strict device configuration (new revision, timezone, schedules without medication labels); device application is acknowledged separately
        '400': {description: Invalid JSON or schedule fields}
        '403': {description: Cross-origin browser edit rejected}
        '409': {description: Stale expected_revision; refresh and resolve the edit}
        '422': {description: Service validation rejected the schedule}
        '502': {$ref: '#/components/responses/Unavailable'}
        '503': {$ref: '#/components/responses/Unavailable'}
components:
  schemas:
    CompanionSchedule:
      type: object
      required: [id, medication, time, compartment, enabled, auth_user_id]
      properties:
        id: {type: string, pattern: '^[A-Za-z0-9_-]{1,32}$'}
        medication: {type: string, minLength: 1, maxLength: 80}
        time: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'}
        compartment: {type: integer, minimum: 1, maximum: 6}
        enabled: {type: boolean}
        auth_user_id: {type: integer, minimum: 1, maximum: 1000}
  responses:
    Unavailable:
      description: Service unavailable, incompatible response, or missing server-side environment
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: {type: string}
