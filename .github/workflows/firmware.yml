name: Firmware checks
on:
  push:
    paths:
      - 'firmware/**'
      - 'tests/**'
      - 'scripts/**'
      - 'requirements-dev.txt'
      - 'pytest.ini'
      - '.github/workflows/firmware.yml'
  pull_request:
    paths:
      - 'firmware/**'
      - 'tests/**'
      - 'scripts/**'
      - 'requirements-dev.txt'
      - 'pytest.ini'
      - '.github/workflows/firmware.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python scripts/demo.py
      - uses: actions/upload-artifact@v4
        with:
          name: dispenser-demo-events
          path: output/demo-events.jsonl
  micropython:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: micropython/micropython
          ref: v1.26.0
          path: micropython-runtime
      - run: sudo apt-get update
      - run: sudo apt-get install -y libffi-dev pkg-config
      - run: make -C micropython-runtime/ports/unix submodules
      - run: make -C micropython-runtime/ports/unix -j2
      - run: micropython-runtime/ports/unix/build-standard/micropython tests/micropython_smoke.py
